name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpeta android
        run: |
          flutter create --platforms=android --project-name kdramas_app _tmp
          cp -r _tmp/android android
          rm -rf _tmp
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: kdramas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
